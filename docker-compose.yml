services:
  traefik:
    container_name: saas-traefik
    image: traefik:v3.3
    command:
      - --api.insecure=true
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --entrypoints.web.address=:80
    ports:
      - "8081:80"
      - "8080:8080"
    volumes:
      - ./docker/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    depends_on:
      - frontend
      - backend

  backend:
    container_name: saas-backend
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile
    working_dir: /var/www/html
    command: >
      sh -c "
        if [ ! -f .env ]; then cp .env.example .env; fi &&
        composer install &&
        if ! grep -q '^APP_KEY=base64:' .env; then php artisan key:generate --force; fi &&
        if ! grep -q '^JWT_SECRET=' .env; then php artisan jwt:secret --force; fi &&
        php artisan config:clear &&
        php artisan serve --host=0.0.0.0 --port=8000
      "
    volumes:
      - ./backend:/var/www/html
    environment:
      HOME: /tmp
      XDG_CONFIG_HOME: /tmp
    depends_on:
      - postgres
      - redis

  frontend:
    container_name: saas-frontend
    image: node:22
    working_dir: /app
    command: sh -c "npm install && npm run dev:docker"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "100"
      WATCHPACK_POLLING: "true"
      VITE_FORCE_POLLING: "true"
      NUXT_HOST: "0.0.0.0"
      NUXT_PORT: "3000"

  postgres:
    container_name: saas-postgres
    image: postgres:16
    environment:
      POSTGRES_DB: mini_saas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    container_name: saas-redis
    image: redis:7
    ports:
      - "6380:6379"

volumes:
  postgres_data:
  frontend_node_modules:
